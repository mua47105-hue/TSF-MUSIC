# 01 — fresh boot: WhatsNew bulletin, 3-step onboarding, Front Page paint.
# A11y-tree anchors only: Pressables/Texts/TextInputs expose testIDs to
# Android's accessibility tree; plain Views do NOT (round-3 finding) —
# so we assert the nameplate text "ZED" and tap feed rows via track-row.
appId: com.tsf.music
name: "01 - fresh boot whatsnew onboarding front page"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "whatsnew-continue"
    timeout: 30000
- takeScreenshot: 01-whatsnew
- tapOn:
    id: "whatsnew-continue"
- extendedWaitUntil:
    visible:
      id: "onb-name-input"
    timeout: 20000
- tapOn:
    id: "onb-name-input"
- inputText: "Zed"
- tapOn:
    id: "onb-continue"
- extendedWaitUntil:
    visible:
      id: "onb-artist"
    timeout: 25000
- takeScreenshot: 01-onb-artists
- tapOn:
    id: "onb-artist"
    index: 0
- tapOn:
    id: "onb-artist"
    index: 1
- tapOn:
    id: "onb-artist"
    index: 2
- assertVisible:
    text: "PICKED 3 · MIN 3"
- tapOn:
    id: "onb-continue"
- extendedWaitUntil:
    visible:
      id: "onb-genre"
    timeout: 15000
- tapOn:
    id: "onb-genre"
    index: 0
- extendedWaitUntil:
    visible:
      text: "PICKED 1 · MIN 3"
    timeout: 10000
- tapOn:
    id: "onb-continue"
- extendedWaitUntil:
    visible:
      id: "home-avatar"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "track-row"
    timeout: 30000
- takeScreenshot: 01-front-page
