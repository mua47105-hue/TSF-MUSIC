# 08 — STRETCH (failure recorded, does not fail the lab): start playback
# fresh (the queue from earlier flows may have drained), then download the
# current song from the player's track menu and wait for the honest
# "Downloaded" toast.
appId: com.tsf.music
name: "08 - stretch download from player menu"
---
- launchApp
- runFlow:
    when:
      notVisible:
        id: "player-dismiss"
    commands:
      - tapOn:
          text: "Index"
      - extendedWaitUntil:
          visible:
            id: "search-input"
          timeout: 20000
      - tapOn:
          id: "search-input"
      - inputText: "arijit"
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: "track-row"
          timeout: 30000
          visibilityPercentage: 30
      - tapOn:
          id: "track-row"
          index: 0
- extendedWaitUntil:
    visible:
      id: "player-toggle"
    timeout: 30000
- tapOn:
    text: "SAVE"
- extendedWaitUntil:
    visible:
      text: "Download"
    timeout: 10000
- tapOn:
    text: "Download"
- extendedWaitUntil:
    visible:
      text: "Downloaded"
    timeout: 120000
- takeScreenshot: 08-downloaded
