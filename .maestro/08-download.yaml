# 08 — STRETCH (failure recorded, does not fail the lab): download a song
# from the player's track menu and wait for the honest "Downloaded" toast.
appId: com.tsf.music
name: "08 - stretch download from player menu"
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "mini-player"
    timeout: 30000
- tapOn:
    id: "mini-player"
- extendedWaitUntil:
    visible:
      id: "player-toggle"
    timeout: 15000
- tapOn:
    text: "SAVE"
- extendedWaitUntil:
    visible:
      text: "Download"
    timeout: 10000
- tapOn:
    text: "Download"
- extendedWaitUntil:
    visible:
      text: "Downloaded"
    timeout: 120000
- takeScreenshot: 08-downloaded
