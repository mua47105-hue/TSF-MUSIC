# 02 — the Index: rapid two-part typing must land ONE clean query.
# The user-reported "hihiz" bug class: fast keystroke appends doubling up.
# We type "ari" then immediately "jit" — the field must commit "arijit" and
# produce real results. Latency comes from the search-run → search-results
# [TSF-PERF] pair in logcat. Tab opened by its label text (a11y-safe).
appId: com.tsf.music
name: "02 - search rapid two-part typing"
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-avatar"
    timeout: 25000
- tapOn:
    text: "Index"
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 15000
- tapOn:
    id: "search-input"
- inputText: "ari"
- inputText: "jit"
- extendedWaitUntil:
    visible:
      id: "track-row"
    timeout: 30000
- takeScreenshot: 02-search-results
