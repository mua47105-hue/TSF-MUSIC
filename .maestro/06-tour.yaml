# 06 — the tour: all four tabs (by their label texts — a11y-safe), the
# Crates Liked hero (top of screen), the Wire desk, the avatar shortcut
# into Stats, and back. Proves core navigation survives a full lap.
appId: com.tsf.music
name: "06 — tab tour: crates, wire, stats, home"
---
- launchApp
- extendedWaitUntil:
    visible:
      text: "ZED"
    timeout: 25000
- tapOn:
    text: "Crates"
- extendedWaitUntil:
    visible:
      id: "liked-hero"
    timeout: 20000
- takeScreenshot: 06-crates
- tapOn:
    text: "Wire"
- extendedWaitUntil:
    visible:
      id: "wire-vibe-input"
    timeout: 15000
- takeScreenshot: 06-wire
- tapOn:
    text: "Front"
- extendedWaitUntil:
    visible:
      id: "home-avatar"
    timeout: 15000
- tapOn:
    id: "home-avatar"
- takeScreenshot: 06-stats
- pressKey: Back
- extendedWaitUntil:
    visible:
      text: "ZED"
    timeout: 10000
