# 06 — the tour: all four tabs, Crates premium banner, Wire desk, the
# avatar shortcut into Stats, and back. Proves core navigation survives a
# full lap with playback state present.
appId: com.tsf.music
name: "06 — tab tour: crates, wire, stats, home"
---
- launchApp
- assertVisible:
    id: "tab-library"
    timeout: 25000
- tapOn:
    id: "tab-library"
- assertVisible:
    id: "premium-banner"
    timeout: 15000
- takeScreenshot: 06-crates
- tapOn:
    id: "tab-wire"
- assertVisible:
    id: "wire-vibe-input"
    timeout: 15000
- takeScreenshot: 06-wire
- tapOn:
    id: "tab-home"
- assertVisible:
    id: "home-avatar"
    timeout: 15000
- tapOn:
    id: "home-avatar"
- takeScreenshot: 06-stats
- pressKey: Back
- assertVisible:
    id: "tab-home"
    timeout: 10000
