# 04 — skips: five consecutive next() presses on the broadsheet player
# (the real user skip path). Each skip-request → audio-playing [TSF-PERF]
# pair is the skip-latency metric (the Spotify-grade bar: p50 ≤ 3s, hard
# fail > 6s). Rapid skipping also stresses queue / stale-URL recovery.
appId: com.tsf.music
name: "04 - skip x5 rapid next presses"
---
- launchApp
- runFlow:
    when:
      notVisible:
        id: "player-dismiss"
    commands:
      - tapOn:
          text: "Index"
      - extendedWaitUntil:
          visible:
            id: "search-input"
          timeout: 20000
      - tapOn:
          id: "search-input"
      - inputText: "arijit"
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: "track-row"
          timeout: 30000
          visibilityPercentage: 30
      - tapOn:
          id: "track-row"
          index: 0
- extendedWaitUntil:
    visible:
      id: "player-toggle"
    timeout: 30000
- repeat:
    times: 5
    commands:
      - tapOn:
          id: "player-next"
      - waitForAnimationToEnd
- assertVisible:
    id: "player-toggle"
- takeScreenshot: 04-after-skips
