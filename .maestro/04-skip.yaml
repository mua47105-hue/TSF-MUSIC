# 04 — skips: five consecutive next() presses. Each skip-request →
# audio-playing [TSF-PERF] pair is the skip-latency metric (the
# Spotify-grade bar: p50 ≤ 3s, hard fail > 6s). Rapid skipping is also a
# stress case for the queue / stale-URL recovery paths. If playback is not
# already running, it starts one via search (on-screen rows).
appId: com.tsf.music
name: "04 - skip x5 rapid next presses"
---
- launchApp
- runFlow:
    when:
      notVisible:
        id: "mini-player"
    commands:
      - tapOn:
          text: "Index"
      - extendedWaitUntil:
          visible:
            id: "search-input"
          timeout: 20000
      - tapOn:
          id: "search-input"
      - inputText: "arijit"
      - extendedWaitUntil:
          visible:
            id: "track-row"
          timeout: 30000
      - tapOn:
          id: "track-row"
          index: 0
      - extendedWaitUntil:
          visible:
            id: "mini-player"
          timeout: 30000
- repeat:
    times: 5
    commands:
      - tapOn:
          id: "mini-next"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "mini-player"
    timeout: 10000
- takeScreenshot: 04-after-skips
