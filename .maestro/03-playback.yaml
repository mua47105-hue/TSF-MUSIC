# 03 — playback: search "arijit", tap the first result row — the app plays
# AND opens the broadsheet player (round-10 screenshot proof: real artwork,
# TSF 320 KBPS badge, progress advancing). Assert the player controls, run
# a pause + resume cycle, dismiss to the mini player. The play-request →
# audio-playing [TSF-PERF] pair is the time-to-audio metric.
appId: com.tsf.music
name: "03 - playback search result to playing"
---
- launchApp
- runFlow:
    when:
      notVisible:
        id: "player-dismiss"
    commands:
      - tapOn:
          text: "Index"
      - extendedWaitUntil:
          visible:
            id: "search-input"
          timeout: 20000
      - tapOn:
          id: "search-input"
      - inputText: "arijit"
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: "track-row"
          timeout: 30000
          visibilityPercentage: 30
      - tapOn:
          id: "track-row"
          index: 0
- extendedWaitUntil:
    visible:
      id: "player-toggle"
    timeout: 30000
- takeScreenshot: 03-player
- tapOn:
    id: "player-toggle"
- assertVisible:
    id: "player-toggle"
- tapOn:
    id: "player-toggle"
- assertVisible:
    id: "player-toggle"
- takeScreenshot: 03-paused-resumed
- tapOn:
    id: "player-dismiss"
- extendedWaitUntil:
    visible:
      id: "mini-player"
    timeout: 15000
- takeScreenshot: 03-miniplayer
