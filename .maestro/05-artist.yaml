# 05 — artist regression: the v4.0.1 fix (artist pages resolve the real
# photo, or fall back to honest initials — never a stranger's album cover).
# Scrolls the Front Page until an artist tile is on screen, opens it,
# requires the Collection screen to render, screenshots the header.
appId: com.tsf.music
name: "05 — artist page opens from the Front Page shelf"
---
- launchApp
- extendedWaitUntil:
    visible:
      text: "ZED"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "home-artist"
    timeout: 40000
- tapOn:
    id: "home-artist"
    index: 0
- extendedWaitUntil:
    visible:
      id: "collection-back"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 05-artist-page
- tapOn:
    id: "collection-back"
- extendedWaitUntil:
    visible:
      text: "ZED"
    timeout: 15000
