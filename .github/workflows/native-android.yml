name: Native Android

# TSF Music — standalone React Native (Expo) app.
#
# What it does:
#   1. stamps versionCode/versionName into app.json (monotonic upgrades)
#   2. `expo prebuild` generates the native android/ project (never committed)
#   3. gradle builds a SIGNED RELEASE APK — keystore from secrets, same
#      signing identity as v1.x so it upgrades in place on the device
#   4. uploads the APK as an artifact; on v* tags publishes a GitHub Release
#
# Architecture: the app is 100% standalone — music APIs are called directly
# from the device (JioSaavn search/streams + iTunes fallback), audio plays
# through react-native-track-player with notification/lock-screen controls.
# No server. No setup. Install the APK and it works.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to publish GitHub Releases on v* tags

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── versioning: versionCode = 100 + run number (jumps past the old
      #    Capacitor builds so Android accepts it as an upgrade) ──────────
      - name: Stamp version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION_NAME="${REF_NAME#v}"
          if [ "$VERSION_NAME" = "$REF_NAME" ]; then
            VERSION_NAME="2.0.${RUN_NUMBER}"
          fi
          export VERSION_NAME
          bun -e "
            const fs = require('fs');
            const a = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            a.expo.android.versionCode = 100 + Number(process.env.RUN_NUMBER);
            a.expo.version = process.env.VERSION_NAME;
            fs.writeFileSync('app.json', JSON.stringify(a, null, 2) + '\n');
            console.log('versionName', a.expo.version, 'versionCode', a.expo.android.versionCode);
          "

      - name: Expo prebuild (generate android/ project)
        run: bunx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: '1'
          CI: '1'

      # ── release signing: decode keystore from secrets to a local file ──
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/app/tsf-release.keystore
          ls -la android/app/tsf-release.keystore

      - name: Patch gradle for release signing
        run: node ci/patch-android-signing.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── preflight: validate the signing secrets NOW. A broken/missing
      #    secret otherwise surfaces only inside :app:packageRelease —
      #    after ~17 minutes of building (seen on run #1: empty secret
      #    ⇒ 0-byte keystore ⇒ "Tag number over 30 is not supported").
      - name: Preflight signing secrets (fail fast in seconds, not after the build)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for v in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret ${v} is NOT set (or empty) on this repo — Settings → Secrets and variables → Actions"
              missing=1
            fi
          done
          [ "$missing" -eq 1 ] && exit 1
          KS=android/app/tsf-release.keystore
          if [ ! -s "$KS" ]; then
            echo "::error::$KS is empty or missing — ANDROID_KEYSTORE_BASE64 is not set or does not decode to a keystore"
            exit 1
          fi
          if ! keytool -list -storetype PKCS12 -keystore "$KS" -storepass "$ANDROID_KEYSTORE_PASSWORD" > /tmp/ks-list.txt 2>&1; then
            echo "::error::Keystore does not open with ANDROID_KEYSTORE_PASSWORD (wrong password or corrupt file):"
            tail -3 /tmp/ks-list.txt
            exit 1
          fi
          if ! grep -q "^${ANDROID_KEY_ALIAS}," /tmp/ks-list.txt; then
            echo "::error::Alias '${ANDROID_KEY_ALIAS}' not found in keystore. Keystore entries:"
            grep -E "^[^,]+," /tmp/ks-list.txt | head -5
            exit 1
          fi
          echo "Preflight OK: keystore opens and alias '${ANDROID_KEY_ALIAS}' is present"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Runner images ship the Android SDK; this defensively guarantees the
      # exact platform/build-tools Expo 52 targets exist + licenses OK.
      - name: Ensure Android SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          ls "$ANDROID_HOME/platforms" || ls /usr/local/lib/android/sdk/platforms

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PTSF_RELEASE_STORE_FILE=tsf-release.keystore \
            -PTSF_RELEASE_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PTSF_RELEASE_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PTSF_RELEASE_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      - name: Verify APK
        run: |
          ls -la android/app/build/outputs/apk/release/
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "APK missing"; exit 1; }
          unzip -l "$APK" | grep -q "classes.dex" && echo "APK structure OK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK" | head -6
          echo "APK signature OK"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsf-music-native-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
