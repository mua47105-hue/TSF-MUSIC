name: Android E2E Lab

# TSF Music — the emulator lab. A real Android environment (KVM-accelerated
# emulator on the GitHub runner — "the optimized form"), real APK, real
# network to JioSaavn/YouTube/iTunes, Maestro flows for every core feature,
# and [TSF-PERF] logcat marks turned into latency metrics:
#   cold start · play→audio · skip→audio (the Spotify-grade bar) · search.
#
# Required flows (01-06) gate the run. Stretch flows (07-08) are evidence.
# Crash / ANR / hard-latency-ceiling breaches fail the lab.
#
# Artifacts uploaded: perf-report.json, logcat, am-start, flow logs,
# screenshots + UI dumps from any failure.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'App.tsx'
      - '.maestro/**'
      - 'scripts/e2e/**'
      - '.github/workflows/android-e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # cheap insurance: never burn a 30-minute emulator run on a red suite
      - name: Test suite + typecheck gate
        run: |
          bun test
          bunx tsc --noEmit

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Ensure Android SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      - name: Expo prebuild (generate android/ project)
        run: bunx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: '1'
          CI: '1'

      # the lab builds the SAME signed release APK the release pipeline
      # ships — what we test is what users get
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/app/tsf-release.keystore

      - name: Patch gradle for release signing
        run: node ci/patch-android-signing.mjs

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PTSF_RELEASE_STORE_FILE=tsf-release.keystore \
            -PTSF_RELEASE_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PTSF_RELEASE_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PTSF_RELEASE_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      # ── Maestro CLI (open-source, runs the flows locally on the runner) ─
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # ── the optimized emulator: KVM hardware accel, small profile,
      #    software GPU, audio LEFT ON (playback state must be honest) ────
      # /dev/kvm exists on ubuntu-24.04 runners but the default udev perms
      # deny the runner user (ProbeKVM: no permissions) — without this the
      # action silently falls back to TCG software emulation and the boot
      # never completes (round-1 finding).
      - name: Grant KVM to the runner user
        run: |
          ls -la /dev/kvm
          sudo chmod 666 /dev/kvm
          sudo udevadm control --reload-rules || true

      - name: Run the lab on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          ram-size: 3072M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -no-snapshot
          script: |
            chmod +x scripts/e2e/run_lab.sh
            ./scripts/e2e/run_lab.sh

      - name: Upload lab artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lab-evidence
          path: |
            lab-artifacts/
          if-no-files-found: warn
          retention-days: 14
